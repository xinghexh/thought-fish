<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Thought Fish — interface illustration</title>
  <desc id="desc">A dark panel showing the Deep diving status on the left and a DeepSeek thought on the right.</desc>
  <rect width="1200" height="320" rx="18" fill="#0f1720"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#263445"/>
  <circle cx="70" cy="80" r="7" fill="#4aa8e8"/>
  <text x="90" y="87" fill="#8a9bb0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">deepseek harness</text>
  <text x="70" y="180" fill="#8a9bb0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23">深度求索中，用时 12 秒 ···</text>
  <text x="1128" y="180" text-anchor="end" fill="#e8a33d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">吃一点白饭没人发现吧。</text>
  <g transform="translate(1144 164)" fill="none" stroke="#8a9bb0" stroke-width="2">
    <path d="M14 2a12 12 0 1 0 0 24c1.3 0 2.2-.9 2.2-2.2 0-1.1-.7-1.8-1.6-2.4-.7-.5-1.1-1.1-1.1-1.8 0-1.3.9-2.2 2.2-2.2h2.5A7.7 7.7 0 0 0 26 9c0-3.9-5.4-7-12-7Z"/>
    <circle cx="8" cy="11" r="1.4" fill="#8a9bb0" stroke="none"/>
    <circle cx="13" cy="7" r="1.4" fill="#8a9bb0" stroke="none"/>
    <circle cx="19" cy="9" r="1.4" fill="#8a9bb0" stroke="none"/>
  </g>
  <text x="70" y="250" fill="#5f7388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">示意图：右侧文字会在你点击时换成下一句</text>
</svg>
